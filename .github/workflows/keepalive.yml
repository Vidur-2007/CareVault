name: Keep alive

# Every 3 days, GET /api/health on the deployed app. The health route makes one cheap query
# against the share store, which keeps a free Supabase project from pausing for inactivity.
# The URL is the repository variable CAREVAULT_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://carevault.example.com. Without it, the job does nothing.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        env:
          CAREVAULT_URL: ${{ vars.CAREVAULT_URL }}
        run: |
          if [ -z "$CAREVAULT_URL" ]; then
            echo "::notice::CAREVAULT_URL is not set; nothing to ping."
            exit 0
          fi
          body=$(curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 30 "${CAREVAULT_URL%/}/api/health")
          echo "$body"
          case "$body" in
            *'"shareStore":true'*) ;;
            *) echo "::warning::The app answered, but the share store did not. Check the Supabase project." ;;
          esac
