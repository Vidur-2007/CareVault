<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:700px;overflow:hidden;background:#d9d4cc;font-family:Arial,Helvetica,sans-serif}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.note{position:absolute;bottom:8px;left:12px;font-size:13px;color:#555}

.box{position:relative;width:760px;height:440px;background:#fff;border:3px solid #6a1b9a;border-radius:10px;padding:36px;box-sizing:border-box;transform:rotate(-4deg)}

.glare{position:absolute;left:250px;top:150px;width:420px;height:140px;background:radial-gradient(ellipse at center,rgba(255,255,255,.93) 0%,rgba(255,255,255,.6) 45%,rgba(255,255,255,0) 72%)}</style></head><body><div class="stage"><div class="box"><div class="brand">Glycomet 500</div><div class="sub">Metformin Hydrochloride Tablets IP 500 mg</div><div class="small">10 Tablets</div><div class="glare"></div></div></div><div class="note">Synthetic benchmark image made for the CareVault OCR test</div></body></html>
